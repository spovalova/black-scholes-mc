[build-system]
requires = ["setuptools>=68", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "bscpp"
version = "0.1.0"
description = "Black-Scholes and Monte Carlo options pricing (C++ core) with a Python backtesting interface"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["python"]
